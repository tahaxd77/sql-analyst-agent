version: '3.8'

services:
  api:
    build: .
    command: uvicorn app.api.main:api --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    env_file:
      - .env

  ui:
    build: .
    command: streamlit run app/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - .:/workspace
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api